<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430">
  <defs>
    <style>
      .heading { font: 700 24px 'Segoe UI', sans-serif; fill: #17223a; }
      .sub { font: 14px 'Segoe UI', sans-serif; fill: #697386; }
      .label { font: 600 16px 'Segoe UI', sans-serif; fill: #17223a; }
      .ribbon-label { font: 13px 'Segoe UI', sans-serif; fill: #252525; }
      .math { font-family: 'Cambria Math', 'STIX Two Math', serif; fill: #185abd; }
    </style>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#17223a" flood-opacity="0.11"/>
    </filter>

    <symbol id="inline-v2" viewBox="0 0 32 32">
      <text x="8" y="25" class="math" font-size="25">Σ</text>
    </symbol>

    <symbol id="display-v2" viewBox="0 0 32 32">
      <path d="M5 5h22M5 27h22" fill="none" stroke="#5a687b" stroke-width="1.5" stroke-linecap="round"/>
      <text x="8" y="24" class="math" font-size="23">Σ</text>
    </symbol>

    <symbol id="numbered-v2" viewBox="0 0 32 32">
      <path d="M3.5 5h25M3.5 27h25" fill="none" stroke="#5a687b" stroke-width="1.35" stroke-linecap="round"/>
      <text x="5" y="24" class="math" font-size="22">Σ</text>
      <text x="21" y="21" font-family="'Segoe UI',sans-serif" font-size="9" font-weight="700" fill="#185abd">(1)</text>
    </symbol>

    <symbol id="block-v2" viewBox="0 0 32 32">
      <rect x="4" y="4" width="24" height="24" rx="2.5" fill="none" stroke="#185abd" stroke-width="1.8"/>
      <text x="8" y="24" class="math" font-size="22">Σ</text>
      <path d="M7 8h18" fill="none" stroke="#185abd" stroke-width="1.25" stroke-linecap="round" opacity=".45"/>
    </symbol>

    <symbol id="reference-v2" viewBox="0 0 32 32">
      <rect x="19" y="4" width="10" height="10" rx="2" fill="none" stroke="#185abd" stroke-width="1.7"/>
      <text x="22" y="12" font-family="'Segoe UI',sans-serif" font-size="8" font-weight="700" fill="#185abd">1</text>
      <rect x="3" y="19" width="10" height="10" rx="2" fill="none" stroke="#185abd" stroke-width="1.7"/>
      <text x="6" y="27" font-family="'Segoe UI',sans-serif" font-size="8" font-weight="700" fill="#185abd">1</text>
      <path d="M13.5 23C22 22 25 18 24 14" fill="none" stroke="#185abd" stroke-width="2" stroke-linecap="round"/>
      <path d="M20.5 16l3.5-3 3 3" fill="none" stroke="#185abd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>

  <rect width="1120" height="430" fill="#f6f8fb"/>
  <text x="40" y="43" class="heading">Ribbon icon concepts — restrained mathematical system</text>
  <text x="40" y="68" class="sub">MathType-inspired hierarchy: one blue mathematical language, minimal structural cues, no miniature illustrations.</text>

  <g transform="translate(40 92)" filter="url(#shadow)">
    <rect width="1040" height="108" rx="8" fill="#fff"/>
    <path d="M0 82h1040" stroke="#d7dce4"/>

    <g transform="translate(50 12)">
      <use href="#inline-v2" x="16" width="40" height="40"/>
      <text x="36" y="68" text-anchor="middle" class="ribbon-label">Inline</text>
      <text x="36" y="84" text-anchor="middle" class="ribbon-label">Math</text>
    </g>
    <g transform="translate(230 12)">
      <use href="#display-v2" x="16" width="40" height="40"/>
      <text x="36" y="68" text-anchor="middle" class="ribbon-label">Display</text>
      <text x="36" y="84" text-anchor="middle" class="ribbon-label">Math</text>
    </g>
    <g transform="translate(410 12)">
      <use href="#numbered-v2" x="16" width="40" height="40"/>
      <text x="36" y="68" text-anchor="middle" class="ribbon-label">Numbered</text>
      <text x="36" y="84" text-anchor="middle" class="ribbon-label">Math</text>
    </g>
    <g transform="translate(590 12)">
      <use href="#block-v2" x="16" width="40" height="40"/>
      <text x="36" y="68" text-anchor="middle" class="ribbon-label">LaTeX</text>
      <text x="36" y="84" text-anchor="middle" class="ribbon-label">Block</text>
    </g>
    <g transform="translate(770 12)">
      <use href="#reference-v2" x="16" width="40" height="40"/>
      <text x="36" y="68" text-anchor="middle" class="ribbon-label">Equation</text>
      <text x="36" y="84" text-anchor="middle" class="ribbon-label">Reference</text>
    </g>
  </g>

  <g transform="translate(40 235)">
    <g transform="translate(0)">
      <rect width="190" height="150" rx="14" fill="#fff"/>
      <use href="#inline-v2" x="59" y="18" width="72" height="72"/>
      <text x="95" y="118" text-anchor="middle" class="label">Inline Math</text>
    </g>
    <g transform="translate(210)">
      <rect width="190" height="150" rx="14" fill="#fff"/>
      <use href="#display-v2" x="59" y="18" width="72" height="72"/>
      <text x="95" y="118" text-anchor="middle" class="label">Display Math</text>
    </g>
    <g transform="translate(420)">
      <rect width="190" height="150" rx="14" fill="#fff"/>
      <use href="#numbered-v2" x="59" y="18" width="72" height="72"/>
      <text x="95" y="118" text-anchor="middle" class="label">Numbered Math</text>
    </g>
    <g transform="translate(630)">
      <rect width="190" height="150" rx="14" fill="#fff"/>
      <use href="#block-v2" x="59" y="18" width="72" height="72"/>
      <text x="95" y="118" text-anchor="middle" class="label">LaTeX Block</text>
    </g>
    <g transform="translate(840)">
      <rect width="190" height="150" rx="14" fill="#fff"/>
      <use href="#reference-v2" x="59" y="18" width="72" height="72"/>
      <text x="95" y="118" text-anchor="middle" class="label">Equation Reference</text>
    </g>
  </g>
</svg>
